    <!-- APK DETECTION AND API OVERRIDE -->
    <script>
      // Set global API base for APK environment (ChatGPT fix)
      window.API_BASE = window.API_BASE || 'https://gabai.ai';
      
      // APK Detection and Configuration
      (function () {
        var w = window;
        
        // Detect if running in APK/WebView environment
        var isAPK = false;
        
        // Check for APK/WebView - NOT file:// since APK loads from https://gabai.ai
        if (window.cordova !== undefined ||
            window.Capacitor !== undefined ||
            /Android.*wv|.*Android.*Version.*Chrome.*Mobile/i.test(navigator.userAgent) ||
            typeof window.Android !== 'undefined' ||
            typeof window.webkit !== 'undefined') {
          isAPK = true;
          console.log('🎯 APK detected - will route API calls to https://gabai.ai');
        }
        
        // Set global flag
        w.IS_APK = isAPK;
        w.IS_VOLTBUILDER_APK = isAPK;
        
        console.log('🔍 APK Detection:', {
          isAPK: isAPK,
          protocol: window.location.protocol,
          hostname: window.location.hostname,
          userAgent: navigator.userAgent,
          hasAndroid: typeof window.Android !== 'undefined',
          hasWebkit: typeof window.webkit !== 'undefined',
          hasCapacitor: typeof window.Capacitor !== 'undefined',
          hasCordova: typeof window.cordova !== 'undefined'
        });
        
        // Initialize Cordova if in APK
        if (isAPK) {
          console.log('📱 Initializing Cordova for APK environment...');
          
          // Wait for deviceready event
          document.addEventListener('deviceready', function() {
            console.log('✅ Cordova deviceready fired!');
            console.log('📱 Available plugins:', {
              cordova: !!window.cordova,
              Media: !!window.Media,
              camera: !!navigator.camera,
              device: !!window.device
            });
            
            // Set flag for React app
            window.CORDOVA_READY = true;
            
            // Dispatch custom event for React
            window.dispatchEvent(new Event('cordova-ready'));
          }, false);
        }
        
        // If APK, override fetch to redirect API calls  
        if (isAPK) {
          console.log('📱 APK environment detected - configuring API override (v27 - ChatGPT fix)');
          
          // v27 Fix from ChatGPT: Ensure ALL relative URLs are converted to absolute
          (function(){
            if (window.__gabaiFetchPatched) return;
            window.__gabaiFetchPatched = true;
            
            var baseFetch = window.fetch.bind(window);
            var isHttp = function(u) { return /^https?:\/\//i.test(u); };
            var isFileOrigin = window.location.protocol === 'file:';
            
            window.fetch = function(input, init) {
              init = init || {};
              var url = typeof input === 'string' ? input : (input && input.url) || '';
              var finalUrl = url;
              
              // ChatGPT Fix: Convert ALL relative API URLs to absolute
              if (url.startsWith('/api/') || url.startsWith('api/')) {
                finalUrl = window.API_BASE + (url.startsWith('/') ? url : '/' + url);
                console.log('🔄 Converting relative to absolute:', url, '→', finalUrl);
              }
              
              // Only process HTTP(S) URLs
              if (!isHttp(finalUrl)) {
                return baseFetch(input, init);
              }
              
              // Handle gabai.ai API calls
              if (finalUrl.includes('gabai.ai/api/')) {
                var headers = new Headers(init.headers || {});
                
                // ChatGPT Fix: Force Bearer-only for APK (no cookies)
                // This prevents cookie-related auth issues from file://
                var useCredentials = 'omit'; // Always omit for APK
                
                // Always add Bearer token for APK
                var token = localStorage.getItem('gabai_token') ||
                           localStorage.getItem('gabai_jwt') ||
                           localStorage.getItem('token') ||
                           sessionStorage.getItem('gabai_token') ||
                           sessionStorage.getItem('token');
                
                if (token && !headers.has('Authorization')) {
                  headers.set('Authorization', 'Bearer ' + token);
                  console.log('🔑 Bearer token auth for:', finalUrl);
                } else if (!token) {
                  console.log('⚠️ No token found for:', finalUrl);
                }
                
                // Preserve Request properties if input is a Request
                var newInit = {};
                if (input && typeof input === 'object' && input.method) {
                  newInit.method = input.method;
                  newInit.body = input.body;
                  newInit.signal = input.signal;
                  newInit.mode = input.mode;
                  newInit.cache = input.cache;
                }
                
                // Apply overrides
                for (var key in init) {
                  if (init.hasOwnProperty(key) && key !== 'headers' && key !== 'credentials') {
                    newInit[key] = init[key];
                  }
                }
                newInit.headers = headers;
                newInit.credentials = useCredentials;
                
                return baseFetch(finalUrl, newInit);
              }
              
              // For other HTTP(S) URLs, pass through
              return baseFetch(finalUrl, init);
            };
            
            window.API_BASE = window.API_BASE || 'https://gabai.ai';
          })();
          
          // Set API base for the app
          w.globalThis = w.globalThis || w;
          w.globalThis.APP_API_BASE = 'https://gabai.ai';
          w.__API_BASE__ = 'https://gabai.ai';
        } else {
          // Web environment
          w.globalThis = w.globalThis || w;
          w.globalThis.APP_API_BASE = window.location.origin;
          w.__API_BASE__ = window.location.origin;
        }
        
        // Capacitor shim for both environments
        w.Capacitor = w.Capacitor || {};
        w.Capacitor.Plugins = w.Capacitor.Plugins || {};
        if (!w.Capacitor.Plugins.App) {
          w.Capacitor.Plugins.App = {
            addListener: function(){ return { remove: function(){} }; }
          };
        }
        w.App = w.App || w.Capacitor.Plugins.App;
        
        console.log('✅ Environment configured (v26):', isAPK ? 'APK' : 'Web');
      })();
    </script>
