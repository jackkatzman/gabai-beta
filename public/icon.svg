<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Chat bubble -->
  <path d="M120 160 C120 140, 140 120, 160 120 L320 120 C340 120, 360 140, 360 160 L360 240 C360 260, 340 280, 320 280 L200 280 L160 320 L160 280 C140 280, 120 260, 120 240 Z" fill="white" opacity="0.9"/>
  
  <!-- AI brain/circuit pattern -->
  <circle cx="240" cy="200" r="15" fill="url(#accent)"/>
  <circle cx="200" cy="180" r="8" fill="url(#accent)" opacity="0.7"/>
  <circle cx="280" cy="180" r="8" fill="url(#accent)" opacity="0.7"/>
  <circle cx="220" cy="220" r="6" fill="url(#accent)" opacity="0.5"/>
  <circle cx="260" cy="220" r="6" fill="url(#accent)" opacity="0.5"/>
  
  <!-- Connection lines -->
  <line x1="240" y1="185" x2="200" y2="180" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <line x1="240" y1="185" x2="280" y2="180" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <line x1="240" y1="215" x2="220" y2="220" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
  <line x1="240" y1="215" x2="260" y2="220" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
  
  <!-- Voice waves -->
  <path d="M140 200 Q150 190, 160 200 Q150 210, 140 200" fill="none" stroke="white" stroke-width="3" opacity="0.6"/>
  <path d="M320 200 Q330 190, 340 200 Q330 210, 320 200" fill="none" stroke="white" stroke-width="3" opacity="0.6"/>
  
  <!-- Bottom section - lists/tasks -->
  <rect x="120" y="340" width="272" height="120" rx="20" fill="white" opacity="0.1"/>
  <rect x="140" y="360" width="60" height="8" rx="4" fill="white" opacity="0.8"/>
  <rect x="140" y="380" width="80" height="8" rx="4" fill="white" opacity="0.6"/>
  <rect x="140" y="400" width="40" height="8" rx="4" fill="white" opacity="0.4"/>
  
  <!-- Checkmarks -->
  <path d="M320 365 L325 370 L335 360" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M320 385 L325 390 L335 380" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>