<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GabAi - Launching App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 400px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            margin: 0 0 1rem;
            font-size: 2rem;
            font-weight: 600;
        }
        p {
            margin: 0.5rem 0;
            opacity: 0.9;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🤖</div>
        <h1>GabAi</h1>
        <div class="spinner"></div>
        <p>Launching your AI assistant...</p>
        <p id="status">Connecting to app...</p>
    </div>

    <script>
        console.log('📱 Mobile redirect page loaded');
        
        // Immediate redirect to the main app
        function redirectToApp() {
            console.log('🚀 Redirecting to main app');
            document.getElementById('status').textContent = 'Opening app...';
            
            // Clear any existing mobile auth flags
            localStorage.removeItem('gabai_mobile_auth_in_progress');
            
            // Force redirect to the root app
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        }
        
        // Start redirect process immediately
        redirectToApp();
        
        // Fallback if automatic redirect fails
        setTimeout(() => {
            document.getElementById('status').innerHTML = 
                'Taking longer than expected...<br><a href="/" style="color: white; text-decoration: underline;">Click here to continue</a>';
        }, 5000);
    </script>
</body>
</html>
