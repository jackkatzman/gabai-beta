[build]
# Build ONLY the client app on Netlify (static site)
command = "npm --prefix client install && npm --prefix client run build"
publish = "client/dist"

[build.environment]
NODE_VERSION = "20.19.0"
NETLIFY = "true"

# Force Netlify to look at an empty functions folder
[functions]
directory = "netlify/no-functions"

# (Make sure you do NOT have a redirects block to /.netlify/functions/*)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
