[build]
# Build ONLY the client app on Netlify (your API is on gabai.ai)
command = "npm --prefix client ci && npm --prefix client run build"
publish = "client/dist"

[build.environment]
NODE_VERSION = "18"
NETLIFY = "true"

# Optional: keep these headers if you want
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
