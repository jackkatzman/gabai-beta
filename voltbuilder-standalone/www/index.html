<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GabAi - Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .loading {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            opacity: 0.7;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <div class="logo">🤖 GabAi</div>
    <div class="loading">Starting your AI assistant...</div>
    <div class="spinner"></div>
    <div class="status" id="status">Connecting to server...</div>

    <script>
        console.log('🚀 GabAi APK starting...');
        
        // Update status
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log('📱 Status:', message);
        }

        // Detect environment
        const isVoltBuilder = window.location.href.includes('file://') || 
                            navigator.userAgent.includes('Android') ||
                            typeof device !== 'undefined';
        
        console.log('🔍 Environment check:', {
            href: window.location.href,
            userAgent: navigator.userAgent,
            isVoltBuilder: isVoltBuilder
        });

        // Redirect to production server after brief loading
        setTimeout(() => {
            updateStatus('Redirecting to GabAi...');
            
            setTimeout(() => {
                console.log('🌐 Redirecting to production server...');
                window.location.href = 'https://gabai.ai/?source=apk&v=1.0.0';
            }, 1000);
        }, 2000);

        // Handle any errors
        window.onerror = function(message, source, lineno, colno, error) {
            console.error('❌ APK Error:', { message, source, lineno, colno, error });
            updateStatus('Error occurred - redirecting...');
            
            setTimeout(() => {
                window.location.href = 'https://gabai.ai/?source=apk&error=1';
            }, 2000);
        };

        // Device ready handler for Cordova/Capacitor
        document.addEventListener('deviceready', function() {
            console.log('📱 Device ready - Cordova/Capacitor loaded');
            updateStatus('Device ready - connecting...');
        });
    </script>
</body>
</html>
