    <!-- V5 SIMPLE AUTHENTICATION APPROACH -->
    <script>
      console.log('🚀 V54 with V5 authentication approach loading...');
      
      // APK Detection and Simple Auth (from working v5 build)
      (function () {
        var w = window;
        
        // Detect if running in APK/WebView environment
        var isAPK = false;
        
        // Check multiple conditions for APK detection
        if (window.location.protocol === 'file:' ||
            window.location.hostname === 'localhost' ||
            /Android.*wv|.*Android.*Version.*Chrome.*Mobile/i.test(navigator.userAgent) ||
            typeof window.Android !== 'undefined' ||
            typeof window.webkit !== 'undefined' ||
            window.Capacitor !== undefined) {
          isAPK = true;
        }
        
        // Set global flags
        w.IS_APK = isAPK;
        w.IS_VOLTBUILDER_APK = isAPK;
        
        console.log('🔍 V5 APK Detection:', {
          isAPK: isAPK,
          protocol: window.location.protocol,
          hostname: window.location.hostname,
          userAgent: navigator.userAgent.substring(0, 100) + '...'
        });
        
        // If APK, override fetch for simple API redirect (v5 working approach)
        if (isAPK) {
          console.log('📱 APK detected - configuring V5 simple authentication');
          
          var originalFetch = window.fetch;
          window.fetch = function(url, options) {
            options = options || {};
            
            // Convert relative URLs to absolute for gabai.ai
            if (typeof url === 'string' && url.startsWith('/api/')) {
              url = 'https://gabai.ai' + url;
              console.log('🔄 V5 API redirect:', url);
              
              // Add token from localStorage if available (simple v5 approach)
              var token = localStorage.getItem('gabai_token');
              if (token) {
                options.headers = options.headers || {};
                options.headers['Authorization'] = 'Bearer ' + token;
                console.log('🔑 V5 Bearer token added');
              }
            }
            
            return originalFetch.call(window, url, options);
          };
          
          // Set API base
          w.globalThis = w.globalThis || w;
          w.globalThis.APP_API_BASE = 'https://gabai.ai';
          w.__API_BASE__ = 'https://gabai.ai';
        } else {
          // Web environment - use current origin
          w.globalThis = w.globalThis || w;
          w.globalThis.APP_API_BASE = window.location.origin;
          w.__API_BASE__ = window.location.origin;
        }
        
        // Capacitor shims for compatibility
        w.Capacitor = w.Capacitor || {};
        w.Capacitor.Plugins = w.Capacitor.Plugins || {};
        if (!w.Capacitor.Plugins.App) {
          w.Capacitor.Plugins.App = {
            addListener: function(){ return { remove: function(){} }; }
          };
        }
        w.App = w.App || w.Capacitor.Plugins.App;
        
        console.log('✅ V54 with V5 simple auth configured:', isAPK ? 'APK mode' : 'Web mode');
      })();
    </script>
