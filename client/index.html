    <script>
      // kill any old service workers/caches (safe)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
      }
      if ('caches' in window) {
        caches.keys().then(names => names.forEach(name => caches.delete(name)));
      }

      // ✅ SINGLE source of truth for API calls (bypass Netlify SPA)
      window.API_BASE = 'https://gabai.ai';

      // ❌ DO NOT set these; they force calls back to the SPA origin:
      // window.globalThis = window.globalThis || window;
      // window.globalThis.APP_API_BASE = window.location.origin;
      // window.__API_BASE__ = window.location.origin;
    </script>
