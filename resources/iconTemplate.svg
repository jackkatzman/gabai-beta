<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  
  <!-- Chat bubble -->
  <g transform="translate(512, 480)">
    <!-- Main bubble -->
    <path d="M-280 -200 Q-300 -220 -280 -240 L280 -240 Q300 -220 280 -200 L280 120 Q280 140 260 140 L60 140 L-40 240 L-40 140 L-260 140 Q-280 140 -280 120 Z" 
          fill="white" 
          filter="url(#shadow)"/>
    
    <!-- Dots inside bubble -->
    <circle cx="-120" cy="-50" r="35" fill="#3b82f6"/>
    <circle cx="0" cy="-50" r="35" fill="#3b82f6"/>
    <circle cx="120" cy="-50" r="35" fill="#3b82f6"/>
  </g>
  
  <!-- GabAi text -->
  <text x="512" y="800" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="white">GabAi</text>
</svg>